name: Android CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore or generate debug keystore
        run: |
          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          NEED_FRESH_KEYSTORE=0
          if [ ! -s debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            NEED_FRESH_KEYSTORE=1
          else
            # Regenerate if container-generated cert Valid-from timestamp is in the future on this runner
            if python3 -c "import subprocess,re,datetime,sys; out=subprocess.check_output(['keytool','-list','-v','-keystore','debug.keystore','-storepass','android'],text=True); m=re.search(r'Valid from:\s*(.+?)\s+until:',out); dt=datetime.datetime.strptime(re.sub(r'\s+[A-Z]{2,5}\s+',' ',m.group(1).strip()),'%a %b %d %H:%M:%S %Y') if m else None; sys.exit(1 if (dt and dt>datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)) else 0)" 2>/dev/null; then
              NEED_FRESH_KEYSTORE=0
            else
              NEED_FRESH_KEYSTORE=1
            fi
          fi
          if [ "${NEED_FRESH_KEYSTORE}" -eq 1 ]; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -startdate 2020/01/01 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-configuration-cache --max-workers=2 --console=plain --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-configuration-cache --max-workers=2 --console=plain --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: toonforge-tagalog-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Signed Release APK (optional if secrets configured)
        id: release_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/release-upload-key.jks
        run: |
          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${STORE_PASSWORD}" ] && [ -n "${KEY_PASSWORD}" ]; then
            echo "${KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 -d > "${KEYSTORE_PATH}"
            ./gradlew :app:assembleRelease --no-configuration-cache --max-workers=2 --console=plain --stacktrace
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets not configured; skipping release APK."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release APK Artifact (optional)
        if: steps.release_apk.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: toonforge-tagalog-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14
